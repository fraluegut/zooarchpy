[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zooarchpy"
dynamic = ["version"]
description = "Verifiable quantitative zooarchaeology: NISP, MNE, MNI, MAU and related indicators with explicit methodological policies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Francisco Javier Luengo Gutiérrez", email = "javierluengogutierrez@gmail.com" }]
keywords = ["zooarchaeology", "archaeozoology", "faunal analysis", "NISP", "MNI"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
# The core stays dependency-free on purpose (see docs/design.md).
dependencies = []

[project.optional-dependencies]
# Planned extras; declared now so that the install command in the docs is stable.
excel = ["openpyxl>=3.1"]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "build", "twine"]

[tool.hatch.version]
path = "src/zooarchpy/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zooarchpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]

[tool.ruff.lint.isort]
known-first-party = ["zooarchpy"]
